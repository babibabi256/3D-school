services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: heritage-3d-pipeline:latest
    container_name: heritage-pipeline
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # COLMAPはCLIでもQtを初期化するため、ヘッドレス環境ではoffscreenを指定
      # （これが無いと "qt.qpa.xcb: could not connect to display" でSIGABRT）
      - QT_QPA_PLATFORM=offscreen
      # python/rich/tqdm の出力を即フラッシュ（分離実行時のログ取りこぼし対策）
      - PYTHONUNBUFFERED=1
    volumes:
      - ./input:/workspace/input
      - ./output:/workspace/output
      - ./configs:/workspace/configs
      - ./src:/workspace/src
      - ./scripts:/workspace/scripts
    working_dir: /workspace
    command: python scripts/run_pipeline.py --config configs/experiment.yaml
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
