project_name: production_001
description: "本番用・高画質設定 (RTX 4050 6GB / high)"

# 入力画像ディレクトリ（実データは input/data）
input_dir: input/data

# 出力ディレクトリ
output_dir: output/production_001

# --- クレンジング ---
cleansing:
  enabled: true
  # このデータセットはラプラシアン分散が低め（中央値≈12, 最大≈40）。
  # 100.0 だと全除外されるため 4.0 に設定（ほぼ全枚数を保持）。
  blur_threshold: 4.0
  duplicate_threshold: 0.95
  exposure_min: 30
  exposure_max: 220
  remove_background: false
  generate_mask: false

# --- COLMAP ---
colmap:
  quality: high                # high → max_image_size=4000, GS解像度=フル(-1)
  matcher: exhaustive          # 約100枚なので exhaustive で可（CPUのため時間はかかる）
  camera_model: SIMPLE_RADIAL  # image_undistorter で PINHOLE に変換してGSへ渡す
  # 重要: このCOLMAPはGPU SIFTにOpenGLを使い、ヘッドレスではGLコンテキストを
  # 作れず落ちるため、特徴抽出・マッチングはCPUで実行する（use_gpu: false）。
  # high画質ではCOLMAP（特に exhaustive マッチング）に十数分以上かかることがある。
  use_gpu: false
  vocab_tree_path: ""

# --- Gaussian Splatting ---
# フル解像度(約1920x1080)・30000反復の本番学習。GPU(GS学習)は有効。
# ※ VRAM 6GB ではフル解像度のGS学習中にメモリ不足(OOM)で落ちる可能性がある。
#    OOMが出た場合の対策（上から順に試す）:
#      1) configs/production_medium.yaml（quality: medium = 解像度1/2）に切替
#      2) densify_until_iter を下げる（例 10000）→ ガウシアン数を抑えVRAM節約
#      3) densify_grad_threshold を上げる（例 0.0003〜0.0004）→ 同上
gaussian:
  iterations: 30000
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  lambda_dssim: 0.2
  sh_degree: 3
  # resolution は quality(high) から自動で フル(-1) に決定される

# --- 評価 ---
evaluation:
  enabled: true
  metrics:
    - psnr
    - ssim
    - lpips

# --- レポート生成 ---
report:
  enabled: true
  format: markdown
  output_file: report.md
