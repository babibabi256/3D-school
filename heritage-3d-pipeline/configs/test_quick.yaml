project_name: test_quick
description: "接続後の動作確認用・軽量設定（RTX 4050 6GB / 短時間）"

# 入力画像ディレクトリ（実データは input/data にある）
input_dir: input/data

# 出力ディレクトリ
output_dir: output/test_quick

# --- クレンジング ---
cleansing:
  enabled: true
  blur_threshold: 100.0
  duplicate_threshold: 0.95
  exposure_min: 30
  exposure_max: 220
  remove_background: false
  generate_mask: false

# --- COLMAP ---
# VRAM 6GB / 動作確認のため low（max_image_size を抑える）
colmap:
  quality: low
  matcher: exhaustive          # 約100枚なので exhaustive で可
  camera_model: SIMPLE_RADIAL
  use_gpu: true
  vocab_tree_path: ""

# --- Gaussian Splatting ---
# 動作確認のため反復回数を大幅に削減（本番は experiment.yaml の 30000）
gaussian:
  iterations: 7000
  densify_until_iter: 5000
  densify_grad_threshold: 0.0002
  lambda_dssim: 0.2
  sh_degree: 3

# --- 評価 ---
evaluation:
  enabled: true
  metrics:
    - psnr
    - ssim
    - lpips

# --- レポート生成 ---
report:
  enabled: true
  format: markdown
  output_file: report.md
