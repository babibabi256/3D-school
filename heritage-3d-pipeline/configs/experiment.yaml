project_name: temple_001
description: "サンプル実験設定"

# 入力画像ディレクトリ
input_dir: input/temple_001

# 出力ディレクトリ
output_dir: output/temple_001

# --- クレンジング ---
cleansing:
  enabled: true
  blur_threshold: 100.0       # ラプラシアン分散の閾値（低いほどブレ検出が厳しい）
  duplicate_threshold: 0.95   # 類似度の閾値（高いほど重複許容が厳しい）
  exposure_min: 30            # 露出下限（輝度平均）
  exposure_max: 220           # 露出上限（輝度平均）
  remove_background: false
  generate_mask: false

# --- COLMAP ---
colmap:
  quality: high               # low / medium / high
                              #   high   → max_image_size=4000, GS resolution=-1
                              #   medium → max_image_size=2500, GS resolution=2
                              #   low    → max_image_size=1500, GS resolution=4
  matcher: exhaustive         # exhaustive / sequential / vocab_tree
                              #   exhaustive  : 小〜中規模（〜500枚）推奨
                              #   sequential  : 動画・連続フレーム向け
                              #   vocab_tree  : 大規模（500枚〜）向け
  camera_model: SIMPLE_RADIAL
  use_gpu: true
  vocab_tree_path: ""         # vocab_tree 使用時のみ指定

# --- Gaussian Splatting ---
gaussian:
  iterations: 30000
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  lambda_dssim: 0.2
  sh_degree: 3
  # resolution は quality 設定から自動決定される

# --- 評価 ---
evaluation:
  enabled: true
  metrics:
    - psnr
    - ssim
    - lpips

# --- レポート生成 ---
report:
  enabled: true
  format: markdown
  output_file: report.md
